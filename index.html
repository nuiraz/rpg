<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<meta name="description" content="RPG de Nathan : mine, combats animés, donjons, dragon, marché, quêtes — jouable dans le navigateur.">
<title>RPG de Nathan</title>
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/pixelify.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=c66f659953">
</head>
<body>
<!-- décor animé derrière l'interface (brume + braises) -->
<div id="bgfx" class="bgfx" aria-hidden="true"><div class="fog f1"></div><div class="fog f2"></div><div id="embers"></div></div>

<div id="app">
  <!-- ===== HUD ===== -->
  <header id="hud" class="frame">
    <div class="hud-id">
      <button id="badge" class="badge" aria-label="Fiche du héros"><small>NIV</small><b id="h-lvl">1</b><img id="h-emblem" class="emblem" src="img/sprites/rank_novice.webp" alt=""></button>
      <button id="who" class="who" aria-label="Fiche du héros"><span class="name">NATHAN</span><span id="h-rank" class="rank">NOVICE</span></button>
      <button id="btn-bag" class="hbtn" aria-label="Inventaire">🎒</button>
      <button id="btn-set" class="hbtn" aria-label="Réglages">⚙️</button>
      <div class="gold" id="h-goldbox" title="Or sur toi / en banque">
        <span class="coin"></span>
        <div><b id="h-gold">0</b><small>banque <span id="h-bank">0</span></small></div>
      </div>
    </div>
    <div class="bars">
      <div class="bar hp" id="bar-hp"><i class="ghost" id="g-hp"></i><i class="fill" id="b-hp"></i><span id="t-hp">PV</span></div>
      <div class="bar en" id="bar-en"><i class="fill" id="b-en"></i><span id="t-en">ÉNERGIE</span></div>
      <div class="bar xp" id="bar-xp"><i class="fill" id="b-xp"></i><span id="t-xp">XP</span></div>
    </div>
    <div class="hud-sub"><span id="h-sub"></span><span id="h-regen"></span></div>
    <div id="chips" class="chips"></div>
  </header>

  <!-- ===== Scène : carte du village / combat animé / vidéo ===== -->
  <main id="stage">
    <div id="screen" class="frame screen">
      <div id="map" class="layer map">
        <div class="map-inner" id="map-inner">
          <div class="map-bg"></div>
          <div class="amb sun"></div>
          <div class="amb glow g1"></div><div class="amb glow g2"></div><div class="amb glow g3"></div><div class="amb glow forge"></div>
          <div class="amb smoke"><i></i><i></i><i></i><i></i></div>
          <div class="amb birds"><i></i><i></i><i></i></div>
          <div id="spots"></div>
        </div>
      </div>
      <video id="scene" class="layer hidden" playsinline webkit-playsinline preload="auto"></video>
      <div id="arena" class="layer arena hidden"></div>
      <div id="harvest" class="layer harvest hidden"></div>
      <div id="tap" class="tap hidden"><span>▶ Toucher pour voir la scène</span></div>
      <div id="caption" class="caption">🏰 Le village t'attend…</div>
      <div class="scr-btns">
        <button id="skip" class="sbtn hidden" aria-label="Passer l'animation">⏩</button>
        <button id="btn-map" class="sbtn" aria-label="Carte du village">🗺️</button>
        <button id="mute" class="sbtn" aria-label="Son">🔊</button>
      </div>
    </div>
    <div id="log" class="log" aria-live="polite"></div>
  </main>

  <!-- ===== Commandes ===== -->
  <nav id="panel" class="frame">
    <div id="cat-info" class="cat-info"></div>
    <div id="cmds" class="cmds"></div>
    <div id="tabs" class="tabs" role="tablist"></div>
  </nav>
</div>

<!-- ===== Feuille de choix / fenêtres ===== -->
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card frame">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-x" class="x" aria-label="Fermer">✕</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>
<div id="lvlup" class="lvlup hidden" aria-live="assertive"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tuto" class="tuto hidden"><div id="tuto-hole" class="tuto-hole"></div><div id="tuto-box" class="tuto-box frame"></div></div>
<div id="tip" class="tip hidden"></div>
<canvas id="fxc" class="fxc" aria-hidden="true"></canvas>
<div id="fx" class="fx"></div>
<noscript><p style="color:#fff;padding:1em">Active JavaScript pour jouer.</p></noscript>

<script src="js/default-save.js?v=c66f659953"></script>
<script src="js/engine.js?v=c66f659953"></script>
<script src="js/sfx.js?v=c66f659953"></script>
<script src="js/fx.js?v=c66f659953"></script>
<script src="js/scene.js?v=c66f659953"></script>
<script src="js/app.js?v=c66f659953"></script>
</body>
</html>
